name: Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Android version name (for example 1.0.0)
        required: true
        default: '0.1.0'
        type: string
      version_code:
        description: Android version code (must increase for every Play upload)
        required: true
        default: '1'
        type: string
      api_base_url:
        description: Release API base URL, including /api/v1/
        required: true
        default: 'https://api.smartme.app/api/v1/'
        type: string
      strict_content:
        description: Fail when the content library is below the PRD launch target
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Verify, build and package
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      # Signing is optional. When the keystore secret is absent the release APK/AAB
      # is built unsigned so pull-request or dry-run builds still work.
      KEYSTORE_BASE64: ${{ secrets.SMARTME_KEYSTORE_BASE64 }}
      KEYSTORE_PATH: /tmp/smartme-release.keystore
      STORE_PASSWORD: ${{ secrets.SMARTME_RELEASE_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.SMARTME_RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.SMARTME_RELEASE_KEY_PASSWORD }}
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
      API_BASE_URL: ${{ inputs.api_base_url }}
      DATABASE_URL: postgresql://smartme:smartme@localhost:5432/smartme?schema=public
      APP_TIME_ZONE: Asia/Kolkata
      JWT_ACCESS_SECRET: release-only-access-secret-0000000000000
      JWT_REFRESH_SECRET: release-only-refresh-secret-000000000000

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smartme
          POSTGRES_PASSWORD: smartme
          POSTGRES_DB: smartme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartme -d smartme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply migrations
        run: pnpm --filter @smartme/backend exec prisma migrate deploy

      - name: Seed verification database
        run: pnpm db:seed

      - name: Verify published content
        run: |
          if [ "${{ inputs.strict_content }}" = "true" ]; then
            pnpm --filter @smartme/backend content:verify -- --strict
          else
            pnpm --filter @smartme/backend content:verify
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build backend and admin
        env:
          NEXT_PUBLIC_API_URL: ${{ inputs.api_base_url }}
        run: pnpm build

      - name: Package backend
        run: |
          tar -czf "$RUNNER_TEMP/smartme-backend-${{ inputs.version_name }}.tar.gz" \
            -C backend dist package.json prisma prisma.config.ts tsconfig.json
          tar -czf "$RUNNER_TEMP/smartme-admin-${{ inputs.version_name }}.tar.gz" \
            -C admin .next package.json next.config.ts

      - name: Upload backend bundle
        uses: actions/upload-artifact@v4
        with:
          name: smartme-backend-${{ inputs.version_name }}
          path: ${{ runner.temp }}/smartme-backend-${{ inputs.version_name }}.tar.gz
          retention-days: 30

      - name: Upload admin bundle
        uses: actions/upload-artifact@v4
        with:
          name: smartme-admin-${{ inputs.version_name }}
          path: ${{ runner.temp }}/smartme-admin-${{ inputs.version_name }}.tar.gz
          retention-days: 30

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Android unit tests and lint
        working-directory: android
        run: |
          ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace \
            "-PSMARTME_VERSION_CODE=$VERSION_CODE" \
            "-PSMARTME_VERSION_NAME=$VERSION_NAME" \
            "-PSMARTME_RELEASE_API_BASE_URL=$API_BASE_URL"

      - name: Build release APK and AAB
        working-directory: android
        run: |
          set -euo pipefail
          SIGNING_ARGS=()
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            SIGNING_ARGS+=("-PSMARTME_RELEASE_STORE_FILE=$KEYSTORE_PATH")
            SIGNING_ARGS+=("-PSMARTME_RELEASE_STORE_PASSWORD=$STORE_PASSWORD")
            SIGNING_ARGS+=("-PSMARTME_RELEASE_KEY_ALIAS=$KEY_ALIAS")
            SIGNING_ARGS+=("-PSMARTME_RELEASE_KEY_PASSWORD=$KEY_PASSWORD")
          fi
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace \
            "-PSMARTME_VERSION_CODE=$VERSION_CODE" \
            "-PSMARTME_VERSION_NAME=$VERSION_NAME" \
            "-PSMARTME_RELEASE_API_BASE_URL=$API_BASE_URL" \
            "${SIGNING_ARGS[@]}"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: smartme-android-apk-${{ inputs.version_name }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: smartme-android-aab-${{ inputs.version_name }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartme-android-reports-${{ inputs.version_name }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Release summary
        run: |
          echo "### SmartMe release ${{ inputs.version_name }} (${{ inputs.version_code }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: \`${{ inputs.api_base_url }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signed: \`${{ env.KEYSTORE_BASE64 != '' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifacts: backend, admin, Android APK and AAB" >> "$GITHUB_STEP_SUMMARY"
