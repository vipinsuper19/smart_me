name: Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Android version name (for example 1.0.0)
        required: true
        default: '0.1.0'
        type: string
      version_code:
        description: Android version code (must increase for every Play upload)
        required: true
        default: '1'
        type: string
      api_base_url:
        description: Release API base URL, including /api/v1/
        required: true
        default: 'https://api.smartme.app/api/v1/'
        type: string
      strict_content:
        description: Fail when the content library is below the PRD launch target
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Verify, build and package
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      # Signing is optional. When the keystore secret is absent the release APK/AAB
      # is built unsigned so pull-request or dry-run builds still work.
      KEYSTORE_BASE64: ${{ secrets.SMARTME_KEYSTORE_BASE64 }}
      KEYSTORE_PATH: /tmp/smartme-release.keystore
      STORE_PASSWORD: ${{ secrets.SMARTME_RELEASE_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.SMARTME_RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.SMARTME_RELEASE_KEY_PASSWORD }}
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
      API_BASE_URL: ${{ inputs.api_base_url }}
      STRICT_CONTENT: ${{ inputs.strict_content }}
      DATABASE_URL: postgresql://smartme:smartme@localhost:5432/smartme?schema=public
      APP_TIME_ZONE: Asia/Kolkata
      JWT_ACCESS_SECRET: release-only-access-secret-0000000000000
      JWT_REFRESH_SECRET: release-only-refresh-secret-000000000000

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smartme
          POSTGRES_PASSWORD: smartme
          POSTGRES_DB: smartme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartme -d smartme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release inputs
        run: |
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version_name: '$VERSION_NAME'. Expected a semantic version such as 1.2.3." >&2
            exit 1
          fi
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "Invalid version_code: '$VERSION_CODE'. Expected a positive integer." >&2
            exit 1
          fi
          if ! [[ "$API_BASE_URL" =~ ^https://[^[:space:]]+/api/v1/$ ]]; then
            echo "Invalid api_base_url: '$API_BASE_URL'. Expected an https URL ending in /api/v1/." >&2
            exit 1
          fi

      - name: Validate signing secrets
        run: |
          present=0
          for value in "${KEYSTORE_BASE64:-}" "${STORE_PASSWORD:-}" "${KEY_ALIAS:-}" "${KEY_PASSWORD:-}"; do
            if [ -n "$value" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -ne 0 ] && [ "$present" -ne 4 ]; then
            echo "Signing is all-or-none: set SMARTME_KEYSTORE_BASE64, SMARTME_RELEASE_STORE_PASSWORD, SMARTME_RELEASE_KEY_ALIAS and SMARTME_RELEASE_KEY_PASSWORD together." >&2
            exit 1
          fi
          if [ "$present" -eq 0 ]; then
            echo "No signing secrets configured; the APK/AAB will be unsigned and must not be uploaded to Play." >&2
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply migrations
        run: pnpm --filter @smartme/backend exec prisma migrate deploy

      - name: Seed verification database
        run: pnpm db:seed

      - name: Verify published content
        run: |
          if [ "$STRICT_CONTENT" = "true" ]; then
            pnpm --filter @smartme/backend content:verify -- --strict
          else
            pnpm --filter @smartme/backend content:verify
          fi

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build backend and admin
        env:
          NEXT_PUBLIC_API_URL: ${{ inputs.api_base_url }}
        run: pnpm build

      - name: Package backend and admin
        run: |
          set -euo pipefail
          # `pnpm deploy` creates a self-contained directory with production
          # node_modules and the built output, so the artifact does not need a
          # fragile `pnpm install --prod` (which would run `prisma generate`
          # without the `prisma` devDependency).
          pnpm --filter @smartme/backend deploy --prod --ignore-scripts --legacy \
            "$RUNNER_TEMP/backend-bundle"
          pnpm --filter @smartme/admin deploy --prod --ignore-scripts --legacy \
            "$RUNNER_TEMP/admin-bundle"

          # Never ship local or CI secrets that happened to be present in the
          # workspace package directory.
          rm -f "$RUNNER_TEMP/backend-bundle/.env" "$RUNNER_TEMP"/backend-bundle/.env.*
          rm -f "$RUNNER_TEMP/admin-bundle/.env" "$RUNNER_TEMP"/admin-bundle/.env.*

          tar -czf "$RUNNER_TEMP/smartme-backend-$VERSION_NAME.tar.gz" \
            -C "$RUNNER_TEMP/backend-bundle" .
          tar -czf "$RUNNER_TEMP/smartme-admin-$VERSION_NAME.tar.gz" \
            -C "$RUNNER_TEMP/admin-bundle" .

      - name: Verify packaged bundles
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/backend-bundle/dist/main.js"
          test -d "$RUNNER_TEMP/backend-bundle/node_modules/@nestjs/core"
          test -f "$RUNNER_TEMP/admin-bundle/.next/BUILD_ID"
          test -d "$RUNNER_TEMP/admin-bundle/node_modules/next"
          test ! -e "$RUNNER_TEMP/backend-bundle/.env"

      - name: Upload backend bundle
        uses: actions/upload-artifact@v4
        with:
          name: smartme-backend-${{ inputs.version_name }}
          path: ${{ runner.temp }}/smartme-backend-${{ inputs.version_name }}.tar.gz
          retention-days: 30

      - name: Upload admin bundle
        uses: actions/upload-artifact@v4
        with:
          name: smartme-admin-${{ inputs.version_name }}
          path: ${{ runner.temp }}/smartme-admin-${{ inputs.version_name }}.tar.gz
          retention-days: 30

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Android unit tests and lint
        working-directory: android
        run: |
          ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace \
            "-PSMARTME_VERSION_CODE=$VERSION_CODE" \
            "-PSMARTME_VERSION_NAME=$VERSION_NAME" \
            "-PSMARTME_RELEASE_API_BASE_URL=$API_BASE_URL"

      - name: Build release APK and AAB
        working-directory: android
        run: |
          set -euo pipefail
          SIGNING_ARGS=()
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            SIGNING_ARGS+=("-PSMARTME_RELEASE_STORE_FILE=$KEYSTORE_PATH")
            SIGNING_ARGS+=("-PSMARTME_RELEASE_STORE_PASSWORD=$STORE_PASSWORD")
            SIGNING_ARGS+=("-PSMARTME_RELEASE_KEY_ALIAS=$KEY_ALIAS")
            SIGNING_ARGS+=("-PSMARTME_RELEASE_KEY_PASSWORD=$KEY_PASSWORD")
          fi
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace \
            "-PSMARTME_VERSION_CODE=$VERSION_CODE" \
            "-PSMARTME_VERSION_NAME=$VERSION_NAME" \
            "-PSMARTME_RELEASE_API_BASE_URL=$API_BASE_URL" \
            "${SIGNING_ARGS[@]}"

      - name: Verify release signature
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        run: |
          set -euo pipefail
          apksigner="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "apksigner was not found in the Android SDK build-tools." >&2
            exit 1
          fi
          "$apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: smartme-android-apk-${{ inputs.version_name }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: smartme-android-aab-${{ inputs.version_name }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartme-android-reports-${{ inputs.version_name }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Release summary
        run: |
          echo "### SmartMe release $VERSION_NAME ($VERSION_CODE)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: \`$API_BASE_URL\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "- Signed: \`true\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Signed: \`false\` (unsigned artifact; do not upload to Play)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Artifacts: backend, admin, Android APK and AAB" >> "$GITHUB_STEP_SUMMARY"
