name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smartme
          POSTGRES_PASSWORD: smartme
          POSTGRES_DB: smartme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartme -d smartme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://smartme:smartme@localhost:5432/smartme?schema=public
      APP_TIME_ZONE: Asia/Kolkata
      # Integration suites boot AppModule, so the config contract must be
      # satisfied in CI too. These are throwaway CI-only values (>= 32 chars).
      JWT_ACCESS_SECRET: ci-only-access-secret-0000000000000000
      JWT_REFRESH_SECRET: ci-only-refresh-secret-00000000000000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply migrations
        run: pnpm --filter @smartme/backend exec prisma migrate deploy

      - name: Seed database
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  android:
    name: Android build and unit tests
    # Pinned while the Android SDK setup tooling catches up with Ubuntu 26.04.
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
